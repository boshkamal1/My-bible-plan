name: bible_journey
description: رحلة الكتاب المقدس - Bible reading journey
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^2.1.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  home_widget: ^0.6.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bible/counts.json
    - assets/bible/svd/
    - assets/bible/kjv/
    - assets/bible/ar_extra/
    - assets/bible/web/
