<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="description" content="رحلة الكتاب المقدس - خطة قراءة وقارئ للكتاب المقدس." />
    <meta name="theme-color" content="#2c4a82" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="رحلة الكتاب المقدس" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>رحلة الكتاب المقدس</title>
    <style>
      #app-loading { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #101827; color: #f5eee1; font-family: system-ui, sans-serif; text-align: center; transition: opacity .3s ease; }
      #app-loading.done { opacity: 0; pointer-events: none; }
      .loading-content { width: min(340px, calc(100vw - 48px)); }
      .loading-book { color: #d7af62; font-size: 54px; line-height: 1; animation: breathe 1.8s ease-in-out infinite; }
      .loading-title { margin: 22px 0 8px; font-size: 25px; font-weight: 700; }
      .loading-caption { color: #c9c0b5; font-size: 15px; }
      .loading-track { height: 4px; margin-top: 28px; border-radius: 8px; overflow: hidden; background: #34343a; }
      .loading-track::after { content: ''; display: block; width: 35%; height: 100%; border-radius: inherit; background: #d7af62; animation: loading-slide 1.4s ease-in-out infinite alternate; }
      .loading-retry { display: none; margin: 20px auto 0; padding: 9px 18px; border: 1px solid #d7af62; border-radius: 10px; background: transparent; color: #f5eee1; font: inherit; cursor: pointer; }
      #app-loading.slow .loading-retry { display: block; }
      @keyframes breathe { 50% { transform: scale(1.08); opacity: .75; } }
      @keyframes loading-slide { from { transform: translateX(0); } to { transform: translateX(-185%); } }
      @media (prefers-reduced-motion: reduce) { .loading-book, .loading-track::after { animation: none; } }
    </style>
  </head>
  <body>
    <script>
      function downloadProgressImage(data) {
        const link = document.createElement('a');
        link.href = data;
        link.download = 'bible-plan-progress.png';
        document.body.appendChild(link);
        link.click();
        link.remove();
      }
    </script>
    <div id="app-loading" role="status" aria-live="polite">
      <div class="loading-content">
        <div class="loading-book" aria-hidden="true">✦</div>
        <div class="loading-title">رحلة الكتاب المقدس</div>
        <div class="loading-caption">بنجهّز قراءاتك...</div>
        <div class="loading-track" aria-hidden="true"></div>
        <button class="loading-retry" onclick="location.reload()">إعادة المحاولة</button>
      </div>
    </div>
    <script src="push.js?v=20261105-25" defer></script>
    <script src="flutter_bootstrap.js?v=20261105-25" defer></script>
  </body>
</html>
